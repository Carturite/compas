<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compaz · esto puede esperar</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      #app { width: min(420px, 100%); }
      h1 { font-size: 26px; font-weight: 600; }
      .timer { position: relative; margin: 8px auto; width: 180px; height: 180px; }
      .timer .clock { position: absolute; inset: 0; display: grid; place-items: center; font-size: 36px; }
      .brand { position: fixed; right: 16px; bottom: 12px; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); opacity: 0.7; }
    </style>
  </head>
  <body data-state="focus">
    <div class="board-bg" aria-hidden="true"></div>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
