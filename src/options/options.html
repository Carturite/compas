<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compaz · ajustes</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body data-state="idle">
    <div class="board-bg" aria-hidden="true"></div>
    <main>
      <h1 id="title"></h1>
      <section class="card stack" id="pieces-card">
        <span id="pieces-title" class="label"></span>
        <p id="pieces-summary" class="small muted"></p>
        <div id="scene-pick" class="inline wrap" role="radiogroup" aria-labelledby="scene-pick-label">
          <span id="scene-pick-label" class="small muted"></span>
        </div>
        <div class="inline wrap">
          <button type="button" class="chip" id="edit-board"></button>
          <span class="dev-slot"></span>
        </div>
      </section>
      <form id="form" class="stack" novalidate>
        <section class="card stack">
          <label for="daily" id="daily-label"></label>
          <div class="inline"><input id="daily" type="number" min="0" max="960" step="5" /> <span id="minutes" class="muted"></span></div>
        </section>

        <section class="card stack">
          <span id="profile-label" class="label"></span>
          <div id="profiles" class="stack" role="radiogroup" aria-labelledby="profile-label"></div>
        </section>

        <section class="card stack">
          <label for="sites" id="sites-label"></label>
          <textarea id="sites" rows="6" spellcheck="false"></textarea>
          <p id="sites-hint" class="small muted"></p>
        </section>

        <section class="card stack">
          <label class="switch">
            <span id="strict-label"></span>
            <input id="strict" type="checkbox" role="switch" />
            <span class="track" aria-hidden="true"></span>
          </label>
          <p id="strict-hint" class="small muted"></p>
          <div class="inline" id="wait-row">
            <label for="wait" id="wait-label"></label>
            <input id="wait" type="number" min="1" max="120" />
          </div>
        </section>

        <section class="card stack">
          <label class="switch">
            <span id="sync-label"></span>
            <input id="sync" type="checkbox" role="switch" />
            <span class="track" aria-hidden="true"></span>
          </label>
          <p id="sync-hint" class="small muted"></p>
        </section>

        <div class="actions">
          <span id="status" class="small muted" role="status"></span>
          <button class="primary" id="save" type="submit"></button>
        </div>
      </form>
    </main>
    <div class="editor" id="editor" hidden>
      <div class="stack" style="gap:6px;flex:1;min-width:220px">
        <div id="scene-tabs" class="scene-tabs" role="tablist" hidden></div>
        <p id="editor-hint" class="small" role="status"></p>
        <span id="tray-label" class="small muted"></span>
        <div id="tray" class="tray"></div>
      </div>
      <div class="editor-actions">
        <span class="dev-slot"></span>
        <button type="button" class="ghost" id="rotate"></button>
        <button type="button" class="ghost" id="to-tray"></button>
        <button type="button" class="ghost" id="cancel-board"></button>
        <button type="button" class="primary" id="save-board"></button>
      </div>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
